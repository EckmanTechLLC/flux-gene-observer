# ── Ships — aggregation ───────────────────────────────────────────────────────
# Existing 3 zones: seeded=2 each.  Two new zones: fresh=2 each.

[[feed]]
namespace = "flux-ships-north-sea"
shape     = "aggregation"

  [[feed.aggregate]]
  name      = "count"
  normalize = { type = "linear_range", min = 0.0, max = 10000.0 }

  [[feed.aggregate]]
  name      = "mean.speed"
  normalize = "ships_speed"

[[feed]]
namespace = "flux-ships-english-channel"
shape     = "aggregation"

  [[feed.aggregate]]
  name      = "count"
  normalize = { type = "linear_range", min = 0.0, max = 2500.0 }

  [[feed.aggregate]]
  name      = "mean.speed"
  normalize = "ships_speed"

[[feed]]
namespace = "flux-ships-thames"
shape     = "aggregation"

  [[feed.aggregate]]
  name      = "count"
  normalize = { type = "linear_range", min = 0.0, max = 1500.0 }

  [[feed.aggregate]]
  name      = "mean.speed"
  normalize = "ships_speed"

# New ship zones — all fresh allocations.

[[feed]]
namespace = "flux-ships-singapore-strait"
shape     = "aggregation"

  [[feed.aggregate]]
  name      = "count"
  normalize = "ships_count_singapore_strait"

  [[feed.aggregate]]
