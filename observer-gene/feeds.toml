  normalize = "ships_speed"

# ── Spaceweather — 4 heterogeneous blocks, 8 fresh signals total ──────────────
# Multiple [[feed]] blocks with the same namespace are legal: each creates its
# own poller with a distinct entity set and schema.

[[feed]]
namespace = "flux-spaceweather"
shape     = "flat_multi"
entities  = ["solar-wind"]

  [[feed.property]]
  path      = "density"
  normalize = "solar_density"

  [[feed.property]]
  path      = "speed_kms"
  normalize = "solar_speed"

  [[feed.property]]
  path      = "temperature"
  normalize = "solar_temp"

[[feed]]
namespace = "flux-spaceweather"
shape     = "scalar"

  [[feed.entity]]
  name      = "active-alerts"
  path      = "count"
  normalize = "alert_count"

[[feed]]
namespace = "flux-spaceweather"
shape     = "scalar"

  [[feed.entity]]
  name      = "kp-index"
  path      = "kp"
  normalize = "kp_index"

[[feed]]
namespace = "flux-spaceweather"
shape     = "flat_multi"
entities  = ["geomag-forecast"]

  [[feed.property]]
  path      = "forecast_day_1"
  normalize = "kp_index"

  [[feed.property]]
  path      = "forecast_day_2"
  normalize = "kp_index"

  [[feed.property]]
  path      = "forecast_day_3"
  normalize = "kp_index"

# ── Volcanoes — aggregation, 8 fresh signals ──────────────────────────────────

[[feed]]
namespace = "flux-volcanoes"
shape     = "aggregation"

  [[feed.aggregate]]
  name      = "count"
  normalize = "volcano_count"

  [[feed.aggregate]]
  name      = "fraction.color_code=GREEN"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.color_code=YELLOW"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.color_code=ORANGE"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.color_code=RED"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.alert_level=ADVISORY"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.alert_level=WATCH"
  normalize = "fraction"

  [[feed.aggregate]]
  name      = "fraction.alert_level=WARNING"
  normalize = "fraction"

# ── Wildfires — flat_multi, 15 regions × 4 properties = 60 fresh signals ──────

[[feed]]
namespace = "flux-wildfires"
shape     = "flat_multi"
entities  = [
  "amazon", "australia-east", "australia-west", "california",
  "canada", "greece-turkey", "iberia", "indonesia",
