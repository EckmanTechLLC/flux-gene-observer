# ── Air quality — flat_multi, 44 cities × 7 properties = 308 fresh signals ────
# Unit caveat: stations report mixed units (ug/m3 vs ppm); signals for
# stations reporting in the non-canonical unit will be near 0 or ceiling.
# Deviations still carry signal; acceptable per option A.

[[feed]]
namespace = "flux-airquality"
shape     = "flat_multi"
entities  = [
  "accra", "addis-ababa", "amsterdam", "anchorage", "auckland",
  "bangkok", "beijing", "berlin", "buenos-aires", "chicago",
  "delhi", "dhaka", "dubai", "ho-chi-minh-city", "hong-kong",
  "honolulu", "jakarta", "karachi", "kolkata", "lagos",
  "lima", "london", "los-angeles", "madrid", "manila",
  "melbourne", "mexico-city", "miami", "mumbai", "nairobi",
  "new-york", "paris", "reykjavik", "riyadh", "rome",
  "santiago", "seoul", "singapore", "stockholm", "sydney",
  "taipei", "tel-aviv", "tokyo", "toronto",
]

  [[feed.property]]
  path      = "pm25"
  normalize = "pm25"

  [[feed.property]]
  path      = "pm10"
  normalize = "pm10"

  [[feed.property]]
  path      = "co"
  normalize = "gas_ppm"

  [[feed.property]]
  path      = "no2"
  normalize = "gas_ppm"

  [[feed.property]]
  path      = "o3"
  normalize = "gas_ppm"

  [[feed.property]]
  path      = "so2"
  normalize = "gas_ppm"

  [[feed.property]]
  path      = "station_count"
  normalize = "station_count"

# ── Grid EU — flat_multi, 10 countries × 2 properties = 20 fresh signals ──────

[[feed]]
namespace = "flux-grid-eu"
shape     = "flat_multi"
entities  = ["be", "de", "es", "fr", "gb", "it", "nl", "no", "pl", "se"]

  [[feed.property]]
  path      = "day_ahead_price_eur_mwh"
  normalize = "eur_per_mwh"

  [[feed.property]]
  path      = "load_mw"
  normalize = "load_mw"

# ── Grid US — flat_multi, 12 respondents × 3 properties = 36 fresh signals ────

[[feed]]
namespace = "flux-grid-us"
shape     = "flat_multi"
entities  = ["bpat", "ciso", "duk", "erco", "fpl", "isne", "miso", "nyis", "pjm", "pnm", "spp", "tva"]

  [[feed.property]]
  path      = "demand_mwh"
  normalize = "us_demand_mwh"

  [[feed.property]]
  path      = "net_generation_mwh"
  normalize = "us_demand_mwh"

  [[feed.property]]
  path      = "total_interchange_mwh"
  normalize = "us_interchange_mwh"

# ── Energy — scalar, 3 EIA entities = 3 fresh signals ────────────────────────
# Note: flux-energy/wti-crude and flux-commodities/wti-crude are separate
# signals (different IDs) from different sources (EIA vs IMF).

[[feed]]
namespace = "flux-energy"
shape     = "scalar"

  [[feed.entity]]
  name         = "henry-hub-natural-gas"
  path         = "value"
  parse_string = true
  normalize    = "natural_gas_usd"

  [[feed.entity]]
  name         = "us-electricity-demand"
  path         = "value"
  parse_string = true
  normalize    = "electricity_demand"

  [[feed.entity]]
  name         = "wti-crude"
  path         = "value"
  parse_string = true
  normalize    = "oil_usd"

# ── ISS — 2 blocks, 4 fresh signals total ─────────────────────────────────────
# iss-position (coordinate object) and timestamp are skipped — not scalar.

[[feed]]
namespace = "flux-iss"
shape     = "scalar"

  [[feed.entity]]
  name      = "iss-crew"
  path      = "number"
  normalize = "iss_crew"

[[feed]]
namespace = "flux-iss"
